name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VIZO_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  # Un solo job: los tests de la Capa 0 y el smoke test estructural necesitan
  # la base levantada, así que separarlos duplicaría el arranque del stack.
  verificacion:
    name: Migraciones, estructura y suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Sin `version`: la toma del campo packageManager de package.json, que es
      # la única fuente de verdad. Declararla en los dos lados hace fallar la
      # action con "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Levanta Postgres y aplica migraciones + seed desde cero. Las
      # aserciones estructurales de la migración 001 corren aquí: si alguna
      # regla dura se viola, la migración falla y el job se pone rojo.
      - name: Migraciones en base limpia
        run: supabase db start

      # Detecta esquema tocado a mano que nadie migró: si la base difiere de
      # lo que producen las migraciones, desarrollo y producción divergieron.
      - name: Sin diffs de esquema pendientes
        run: |
          DIFF=$(supabase db diff --local 2>/dev/null | tail -1 | jq -r '.diff')
          if [ -n "$DIFF" ]; then
            echo "::error::Hay cambios de esquema sin migrar:"
            echo "$DIFF"
            exit 1
          fi
          echo "Sin diffs pendientes."

      # Aislamiento cross-tenant, append-only, encadenado de la bitácora,
      # separación de roles y los tres ataques que la auditoría de la semana 1
      # reprodujo. Si algo de esto se rompe no es un bug: es un incidente.
      - name: Smoke test estructural
        run: psql "$VIZO_DB_URL" -v ON_ERROR_STOP=1 -f tests/estructura/smoke.sql

      # Capa 0, cargador, aritmética y registro de evaluaciones: BLOQUEANTE.
      # Todo esto ya está implementado y no tiene por qué fallar.
      #
      # Corre DESPUÉS del smoke test a propósito: estos tests insertan datos y
      # el smoke exige una base recién reseteada (la bitácora es append-only,
      # así que no se puede limpiar).
      - name: Catálogo, cargador, aritmética y persistencia
        run: |
          pnpm exec vitest run \
            tests/catalogo \
            tests/persistencia \
            tests/umbrales/aritmetica.test.ts \
            tests/umbrales/precondiciones.test.ts

      # ─────────────────────────────────────────────────────────────────────
      # BLOQUEANTE desde la semana 4
      # ─────────────────────────────────────────────────────────────────────
      # El `continue-on-error` que permitió tener la suite en rojo mientras se
      # escribía antes que el motor se retiró al cerrar la semana 4, en la
      # fecha que decía su propio comentario.
      #
      # Esta suite es el criterio de aceptación real del proyecto
      # (docs/PRUEBAS.md): un umbral mal calculado no produce un bug, produce
      # un aviso omitido. Si se pone roja, no se despliega.
      - name: Suite del motor de umbrales
        run: pnpm test:umbrales
