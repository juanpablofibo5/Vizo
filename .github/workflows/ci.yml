name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VIZO_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  # Un solo job: los tests de la Capa 0 y el smoke test estructural necesitan
  # la base levantada, así que separarlos duplicaría el arranque del stack.
  verificacion:
    name: Migraciones, estructura y suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Sin `version`: la toma del campo packageManager de package.json, que es
      # la única fuente de verdad. Declararla en los dos lados hace fallar la
      # action con "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Levanta Postgres y aplica migraciones + seed desde cero. Las
      # aserciones estructurales de la migración 001 corren aquí: si alguna
      # regla dura se viola, la migración falla y el job se pone rojo.
      - name: Migraciones en base limpia
        run: supabase db start

      # Detecta esquema tocado a mano que nadie migró: si la base difiere de
      # lo que producen las migraciones, desarrollo y producción divergieron.
      - name: Sin diffs de esquema pendientes
        run: |
          DIFF=$(supabase db diff --local 2>/dev/null | tail -1 | jq -r '.diff')
          if [ -n "$DIFF" ]; then
            echo "::error::Hay cambios de esquema sin migrar:"
            echo "$DIFF"
            exit 1
          fi
          echo "Sin diffs pendientes."

      # Aislamiento cross-tenant, append-only, encadenado de la bitácora,
      # separación de roles y los tres ataques que la auditoría de la semana 1
      # reprodujo. Si algo de esto se rompe no es un bug: es un incidente.
      - name: Smoke test estructural
        run: psql "$VIZO_DB_URL" -v ON_ERROR_STOP=1 -f tests/estructura/smoke.sql

      # Capa 0, cargador y aritmética de centavos: BLOQUEANTE. Todo esto ya
      # está implementado y no tiene por qué fallar.
      - name: Catálogo, cargador y aritmética
        run: pnpm exec vitest run tests/catalogo tests/umbrales/aritmetica.test.ts

      # ─────────────────────────────────────────────────────────────────────
      # ROJO CONTROLADO — se retira al cerrar la semana 4 (6 de septiembre)
      # ─────────────────────────────────────────────────────────────────────
      # La suite del motor existe ANTES que el motor, a propósito
      # (docs/PLAN.md semanas 2-4). Hoy falla completa con
      # `MotorNoImplementado`, que es el estado correcto.
      #
      # `continue-on-error` es una excepción con fecha de caducidad, no una
      # costumbre: en cuanto el motor esté implementado se borra esta línea y
      # la suite pasa a ser bloqueante. Si sigue aquí después del checkpoint
      # de la semana 4, es deuda, no diseño.
      - name: Suite del motor de umbrales (en rojo hasta la semana 4)
        id: motor
        continue-on-error: true
        run: pnpm test:umbrales

      - name: Estado de la suite del motor
        if: always()
        run: |
          if [ "${{ steps.motor.outcome }}" = "success" ]; then
            echo "::notice::El motor de umbrales pasa la suite. Quita continue-on-error del workflow."
          else
            echo "::warning::Suite del motor en rojo — esperado hasta la semana 4 (docs/PRUEBAS.md)."
          fi
